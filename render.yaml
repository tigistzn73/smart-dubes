services:
  - type: web
    name: smart-dubes
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # Both migrations are idempotent, so running them on every deploy is safe.
    # migrate:auth-lockout adds the lockout and OTP columns; migrate:email-required
    # makes users.email NOT NULL and unique, which the password-reset OTP depends
    # on. Order matters: email-required reads the reset columns' table only for
    # its own checks, and neither depends on the other's output, but running them
    # in sequence is clearer than in parallel.
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server && npm run migrate:auth-lockout --prefix server && npm run migrate:email-required --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Persistence: point this at a free hosted Postgres (Neon / Supabase / Aiven).
      # Without it the app falls back to an on-disk JSON file that Render wipes
      # on every deploy, so all SMS history and ledger data is lost.
      - key: DATABASE_URL
        sync: false
      # Africa's Talking SMS. Optional — without it SMS runs in simulation mode.
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # sandbox = free test endpoint, nothing is billed or actually delivered.
      # Switch to live only once a sender ID is approved and real SMS is wanted.
      - key: AT_ENV
        value: sandbox
      # Twilio SMS/MMS. The only gateway that can carry the court letter image,
      # and the preferred one. Trial accounts only reach verified recipients.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Set this INSTEAD of TWILIO_FROM_NUMBER to let a Messaging Service own
      # the sender number and handle opt-outs.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: SMS_GATEWAY_ORDER
        value: twilio,africastalking
      # Password-reset OTP delivery.
      #
      # Free instances cannot use SMTP at all: Render blocks outbound traffic to
      # ports 25, 465 and 587 on free web services (changelog 2025-09-16, live
      # 2025-09-26), so every SMTP transport times out here regardless of port or
      # provider. An HTTPS API on 443 is the only thing that works on a free
      # instance. Set an API key below to use one; the SMTP_* block is kept so
      # that a paid instance, where 465 and 587 work again, needs no change.
      #
      # Verify EMAIL_FROM against the chosen provider before deploying, or every
      # send fails with 403 and no customer ever receives a code:
      #   Resend   — verify the domain and set EMAIL_FROM to a mailbox on it.
      #   SendGrid — verify the address as a single sender identity, no domain
      #              needed, which is why it suits a pilot.
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Omit to auto-detect from whichever key is set. Set explicitly to force
      # one transport, e.g. "smtp" to stay on SMTP even with a key present.
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      # A Gmail App Password, not the account password.
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Fail the send rather than silently downgrading to plaintext if the
      # STARTTLS handshake does not negotiate.
      - key: SMTP_REQUIRE_TLS
        value: 'true'
      # Brand name in the subject and body of every email the app sends.
      - key: APP_NAME
        value: Smart Dube
      # Only affects the SMTP transport, which is the one that resolves a relay
      # hostname. Render advertises IPv6 interfaces without a route to them, so
      # nodemailer's random pick between a relay's A and AAAA records otherwise
      # fails with ENETUNREACH about half the time.
      - key: SMTP_IPV4_ONLY
        value: 'true'
      # Render exposes RENDER_EXTERNAL_URL automatically, which is all the
      # letter image URL needs. Set PUBLIC_BASE_URL only to override it.
      - key: PUBLIC_BASE_URL
        sync: false
    # Render's base image ships no system fonts, and the court letter renderer
    # draws text from a font file on disk. Without this the letter still issues
    # and is still sent, but as text rather than as a blank page.
    apt:
      packages:
        - fonts-dejavu-core
