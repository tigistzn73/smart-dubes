    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Dube | Digital BNPL & Ledger for Ethiopian Merchants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint. Without this the page renders
      // in the default dark theme and flips to the saved one only after React
      // mounts, which shows a dark flash on every reload in bright mode.
      (function () {
        try {
          var saved = localStorage.getItem('smart_dube_theme');
          if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {
          // localStorage can throw in private browsing; default theme is fine.
        }
      })();
    </script>
  </head>
  <body class="bg-ethiopia-dark text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
